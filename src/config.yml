# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/v0.63.1/schema/config.json

gui:
  nerdFontsVersion: "3"
  border: "rounded"
  showFileTree: true
  showBottomLine: true
  showPanelJumps: true
  showListFooter: true
  showRandomTip: false
  showCommandLog: false
  expandFocusedSidePanel: false
  commitHashLength: 8
  scrollHeight: 2
  mouseEvents: true
  showNumstatInFilesView: true
  showDivergenceFromBaseBranch: arrowAndNumber
  filterMode: fuzzy
  fileTreeSortOrder: foldersFirst
  statusPanelView: allBranchesLog
  sidePanelWidth: 0.25
  scrollOffMargin: 5
  shrinkSidePanelsToContent: true
  useHunkModeInStagingView: true
  wrapLinesInStagingView: true

git:
  autoFetch: true
  skipHookPrefix: WIP
  mainBranches:
    - master
    - main
  parseEmoji: true
  autoForwardBranches: allBranches
  fetchAll: true
  overrideGpg: true
  remoteBranchSortOrder: alphabetical
  pagers:
    - name: delta
      pager: >-
        delta --paging=never --dark --line-numbers --hyperlinks
        --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
        --syntax-theme="OneHalfDark"
        --file-style "#FFBE89"
        --hunk-header-style "#79a0aa"
        --minus-style 'syntax "#2b1a1c"'
        --plus-style 'syntax "#1a2b20"'
        --line-numbers-minus-style "#F57A7A"
        --line-numbers-plus-style "#7EAB8E"
    - name: delta-side-by-side
      pager: >-
        delta --paging=never --dark --side-by-side
        --syntax-theme="OneHalfDark"
        --file-style "#FFBE89"
        --hunk-header-style "#79a0aa"
    - name: difft
      externalDiffCommand: difft --color=always --display=inline --background=dark
    - {} # built-in diff renderer

# Editor integration adapted from phtea/dotfiles:
# https://github.com/phtea/dotfiles/blob/main/lazygit/.config/lazygit/config.yml
# The upstream `openInTerminal` key is not a valid lazygit option; the
# nvim-remote preset already suspends lazygit based on whether $NVIM is set.
os:
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send "{{line}}gg")'
  openDirInEditor: '[ -z "$NVIM" ] && (nvim -- {{dir}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{dir}})'
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}})'
  editPreset: 'nvim-remote'
  copyToClipboardCmd: 'wl-copy {{text}}'
  readFromClipboardCmd: 'wl-paste --no-newline'

disableStartupPopups: true
notARepository: 'skip'
promptToReturnFromSubprocess: false
quitOnTopLevelReturn: true
update:
  method: 'never'

keybinding:
  universal:
    scrollDownMain-alt2: '<c-f>'
    scrollUpMain-alt2: '<c-b>'
    # Панели по порядку: status, files (diff), branches, commits, stash
    jumpToBlock:
      - '0'
      - '1'
      - '3'
      - '4'
      - '5'

customCommands:
  # ── Conventional Commits ──────────────────────────────────────────────
  - key: 'c'
    context: 'files'
    description: 'Conventional commit'
    loadingText: 'Committing...'
    prompts:
      - type: 'menu'
        title: 'Commit type'
        key: 'Type'
        options:
          - value: 'feat'
            name: 'feat'
            description: 'new feature'
            key: 'f'
          - value: 'fix'
            name: 'fix'
            description: 'bug fix'
            key: 'x'
          - value: 'chore'
            name: 'chore'
            description: 'maintenance'
            key: 'h'
          - value: 'refactor'
            name: 'refactor'
            description: 'code restructuring'
            key: 'r'
          - value: 'docs'
            name: 'docs'
            description: 'documentation'
            key: 'd'
          - value: 'style'
            name: 'style'
            description: 'formatting, no logic change'
            key: 's'
          - value: 'test'
            name: 'test'
            description: 'adding/updating tests'
            key: 't'
          - value: 'ci'
            name: 'ci'
            description: 'CI/CD changes'
            key: 'c'
          - value: 'build'
            name: 'build'
            description: 'build system or deps'
            key: 'b'
          - value: 'perf'
            name: 'perf'
            description: 'performance improvement'
            key: 'p'
      - type: 'input'
        title: 'Scope (optional, e.g. auth, api)'
        key: 'Scope'
        initialValue: ''
      - type: 'input'
        title: 'Commit message'
        key: 'Message'
    command: >-
      git commit -m "{{.Form.Type}}{{if .Form.Scope}}({{.Form.Scope}}){{end}}: {{.Form.Message}}"

  # ── Copy Branch Name ─────────────────────────────────────────────────
  - key: 'y'
    context: 'localBranches'
    description: 'Copy branch name to clipboard'
    command: 'printf "%s" {{.SelectedLocalBranch.Name | quote}} | wl-copy'
    output: 'none'

  # ── Stash with Name ──────────────────────────────────────────────────
  - key: 's'
    context: 'files'
    description: 'Stash with name'
    loadingText: 'Stashing...'
    prompts:
      - type: 'input'
        title: 'Stash name'
        key: 'StashName'
    command: 'git stash push -m "{{.Form.StashName}}"'

  # ── Reset Menu ───────────────────────────────────────────────────────
  - key: 'D'
    context: 'files'
    description: 'Reset to HEAD (menu)'
    prompts:
      - type: 'menu'
        title: 'Reset mode'
        key: 'Mode'
        options:
          - value: '--soft'
            name: 'soft'
            description: 'keep changes staged'
            key: 's'
          - value: '--mixed'
            name: 'mixed'
            description: 'unstage, keep in worktree'
            key: 'm'
          - value: '--hard'
            name: 'hard'
            description: 'discard all changes'
            key: 'h'
      - type: 'confirm'
        title: 'Confirm reset'
        body: 'This will reset HEAD. Continue?'
    command: 'git reset {{.Form.Mode}} HEAD'

  # ── Squash Down with Message ─────────────────────────────────────────
  - key: 'S'
    context: 'commits'
    description: 'Squash down with message'
    loadingText: 'Squashing...'
    prompts:
      - type: 'input'
        title: 'New commit message'
        key: 'Message'
    command: >-
      git reset --soft {{.SelectedCommit.Hash}}^ &&
      git commit -m "{{.Form.Message}}"

  # ── Bisect Run ───────────────────────────────────────────────────────
  - key: 'B'
    context: 'commits'
    description: 'Bisect run'
    loadingText: 'Bisecting...'
    prompts:
      - type: 'input'
        title: 'Test command'
        key: 'TestCmd'
    command: 'git bisect start && git bisect bad && git bisect good {{.SelectedCommit.Hash}}^ && git bisect run {{.Form.TestCmd}}'

  # ── Amend + Force Push ───────────────────────────────────────────────
  - key: 'A'
    context: 'files'
    description: 'Amend commit + force push'
    loadingText: 'Amending and pushing...'
    prompts:
      - type: 'confirm'
        title: 'Amend last commit and force push?'
        body: 'This will amend the last commit and force push to origin.'
    command: 'git commit --amend --no-edit && git push --force-with-lease'

  # ── Gitflow ──────────────────────────────────────────────────────────

  # New branch (unified menu)
  - key: '<c-n>'
    context: 'localBranches'
    description: 'Gitflow: new branch'
    loadingText: 'Creating branch...'
    prompts:
      - type: 'menu'
        title: 'Branch type'
        key: 'Type'
        options:
          - value: 'feature'
            name: 'Feature'
            description: 'new feature branch off develop'
            key: 'f'
          - value: 'release'
            name: 'Release'
            description: 'release branch off develop'
            key: 'r'
          - value: 'hotfix'
            name: 'Hotfix'
            description: 'hotfix branch off main'
            key: 'h'
          - value: 'develop'
            name: 'Develop'
            description: 'checkout/create develop branch'
            key: 'd'
          - value: 'custom'
            name: 'Custom'
            description: 'plain branch, no gitflow prefix'
            key: 'c'
      - type: 'input'
        title: 'Task ID (optional, e.g. PROJ-123)'
        key: 'TaskID'
        initialValue: ''
      - type: 'input'
        title: 'Branch name'
        key: 'Name'
    command: >-
      {{if eq .Form.Type "feature"}}
      git flow feature start {{if .Form.TaskID}}{{.Form.TaskID}}-{{end}}{{.Form.Name}}
      {{else if eq .Form.Type "release"}}
      git flow release start {{.Form.Name}}
      {{else if eq .Form.Type "hotfix"}}
      git flow hotfix start {{.Form.Name}}
      {{else if eq .Form.Type "develop"}}
      git checkout develop 2>/dev/null || git checkout -b develop main
      {{else if eq .Form.Type "custom"}}
      git checkout -b {{if .Form.TaskID}}{{.Form.TaskID}}-{{end}}{{.Form.Name}}
      {{end}}

  # Feature finish
  - key: '<c-g>'
    context: 'localBranches'
    description: 'Gitflow: feature finish'
    loadingText: 'Finishing feature...'
    prompts:
      - type: 'menuFromCommand'
        title: 'Feature branch to finish'
        key: 'Branch'
        command: "git branch --list 'feature/*' --format='%(refname:short)'"
    command: 'git flow feature finish {{.Form.Branch}}'

  # Release finish
  - key: '<c-t>'
    context: 'localBranches'
    description: 'Gitflow: release finish'
    loadingText: 'Finishing release...'
    prompts:
      - type: 'menuFromCommand'
        title: 'Release branch to finish'
        key: 'Branch'
        command: "git branch --list 'release/*' --format='%(refname:short)'"
    command: 'git flow release finish {{.Form.Branch}}'

  # Hotfix finish
  - key: '<c-j>'
    context: 'localBranches'
    description: 'Gitflow: hotfix finish'
    loadingText: 'Finishing hotfix...'
    prompts:
      - type: 'menuFromCommand'
        title: 'Hotfix branch to finish'
        key: 'Branch'
        command: "git branch --list 'hotfix/*' --format='%(refname:short)'"
    command: 'git flow hotfix finish {{.Form.Branch}}'

  # Init gitflow
  - key: '<c-i>'
    context: 'status'
    description: 'Gitflow: init'
    loadingText: 'Initializing gitflow...'
    prompts:
      - type: 'confirm'
        title: 'Initialize gitflow in this repo?'
        body: 'Will run "git flow init -d" with default branch names.'
    command: 'git flow init -d'

  # Feature track (publish)
  - key: '<c-p>'
    context: 'localBranches'
    description: 'Gitflow: feature publish'
    loadingText: 'Publishing feature...'
    prompts:
      - type: 'menuFromCommand'
        title: 'Feature branch to publish'
        key: 'Branch'
        command: "git branch --list 'feature/*' --format='%(refname:short)'"
    command: 'git flow feature publish {{.Form.Branch}}'

  # Feature pull
  - key: '<c-u>'
    context: 'localBranches'
    description: 'Gitflow: feature pull'
    loadingText: 'Pulling feature...'
    prompts:
      - type: 'input'
        title: 'Feature branch name'
        key: 'Name'
    command: 'git flow feature pull origin {{.Form.Name}}'

  # ── History & Cleanup ────────────────────────────────────────────────
  - key: 'u'
    context: 'files'
    description: 'Undo last commit (soft reset)'
    command: 'git reset --soft HEAD~1'

  - key: 'b'
    context: 'files'
    description: 'Blame file'
    command: 'git blame --date=short {{.SelectedFile.Name | quote}}'
    output: 'terminal'

  - key: 'X'
    context: 'localBranches'
    description: 'Prune local branches with gone upstream'
    loadingText: 'Pruning...'
    command: >-
      git for-each-ref --format='%(refname:short) %(upstream:track) %(worktreepath)' refs/heads
      | awk '$2 == "[gone]" && $3 == "" {print $1}'
      | xargs -r git branch -D

  - key: 'X'
    context: 'remotes'
    description: 'Prune deleted remote branches'
    loadingText: 'Pruning...'
    command: 'git remote prune {{.SelectedRemote.Name}}'

  - key: 'V'
    context: 'localBranches'
    description: 'Checkout GitHub PR'
    loadingText: 'Checking out PR...'
    prompts:
      - type: 'input'
        title: 'PR number'
        key: 'PR'
    command: 'gh pr checkout {{.Form.PR}}'
