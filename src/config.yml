gui:
  nerdFontsVersion: "3"
  border: "rounded"
  showFileTree: true
  showBottomLine: true
  showPanelJumps: true
  showListFooter: true
  showRandomTip: false
  showCommandLog: false
  expandFocusedSidePanel: false
  commitHashLength: 8
  scrollHeight: 2
  mouseEvents: true

git:
  autoFetch: true
  skipHookPrefix: WIP
  mainBranches:
    - master
    - main

customCommands:
  # ── Conventional Commits ──────────────────────────────────────────────
  - key: 'c'
    context: 'files'
    description: 'Conventional commit'
    loadingText: 'Committing...'
    prompts:
      - type: 'menu'
        title: 'Commit type'
        key: 'Type'
        options:
          - value: 'feat'
            name: 'feat'
            description: 'new feature'
            key: 'f'
          - value: 'fix'
            name: 'fix'
            description: 'bug fix'
            key: 'x'
          - value: 'chore'
            name: 'chore'
            description: 'maintenance'
            key: 'h'
          - value: 'refactor'
            name: 'refactor'
            description: 'code restructuring'
            key: 'r'
          - value: 'docs'
            name: 'docs'
            description: 'documentation'
            key: 'd'
          - value: 'style'
            name: 'style'
            description: 'formatting, no logic change'
            key: 's'
          - value: 'test'
            name: 'test'
            description: 'adding/updating tests'
            key: 't'
          - value: 'ci'
            name: 'ci'
            description: 'CI/CD changes'
            key: 'c'
          - value: 'build'
            name: 'build'
            description: 'build system or deps'
            key: 'b'
          - value: 'perf'
            name: 'perf'
            description: 'performance improvement'
            key: 'p'
      - type: 'input'
        title: 'Scope (optional, e.g. auth, api)'
        key: 'Scope'
        initialValue: ''
      - type: 'input'
        title: 'Commit message'
        key: 'Message'
    command: >-
      git commit -m "{{.Form.Type}}{{if .Form.Scope}}({{.Form.Scope}}){{end}}: {{.Form.Message}}"

  # ── Copy Branch Name ─────────────────────────────────────────────────
  - key: 'y'
    context: 'localBranches'
    description: 'Copy branch name to clipboard'
    command: 'printf "%s" "{{.SelectedLocalBranch.Name}}" | xclip -selection clipboard'
    output: 'none'

  # ── Stash with Name ──────────────────────────────────────────────────
  - key: 's'
    context: 'files'
    description: 'Stash with name'
    loadingText: 'Stashing...'
    prompts:
      - type: 'input'
        title: 'Stash name'
        key: 'StashName'
    command: 'git stash push -m "{{.Form.StashName}}"'

  # ── Reset Menu ───────────────────────────────────────────────────────
  - key: 'D'
    context: 'files'
    description: 'Reset to HEAD (menu)'
    prompts:
      - type: 'menu'
        title: 'Reset mode'
        key: 'Mode'
        options:
          - value: '--soft'
            name: 'soft'
            description: 'keep changes staged'
            key: 's'
          - value: '--mixed'
            name: 'mixed'
            description: 'unstage, keep in worktree'
            key: 'm'
          - value: '--hard'
            name: 'hard'
            description: 'discard all changes'
            key: 'h'
      - type: 'confirm'
        title: 'Confirm reset'
        body: 'This will reset HEAD. Continue?'
    command: 'git reset {{.Form.Mode}} HEAD'

  # ── Open Commit in Browser ───────────────────────────────────────────
  - key: 'o'
    context: 'commits'
    description: 'Open commit in browser'
    command: 'git open https://{{runCommand "git remote get-url origin" | sed "s/\\.git$//" | sed "s|git@\\([^:]*\\):|https://\\1/"}}/commit/{{.SelectedCommit.Hash}}'

  # ── Squash Down with Message ─────────────────────────────────────────
  - key: 'S'
    context: 'commits'
    description: 'Squash down with message'
    loadingText: 'Squashing...'
    prompts:
      - type: 'input'
        title: 'New commit message'
        key: 'Message'
    command: >-
      git reset --soft {{.SelectedCommit.Hash}}^ &&
      git commit -m "{{.Form.Message}}"

  # ── Bisect Run ───────────────────────────────────────────────────────
  - key: 'B'
    context: 'commits'
    description: 'Bisect run'
    loadingText: 'Bisecting...'
    prompts:
      - type: 'input'
        title: 'Test command'
        key: 'TestCmd'
    command: 'git bisect start && git bisect bad && git bisect good {{.SelectedCommit.Hash}}^ && git bisect run {{.Form.TestCmd}}'

  # ── Amend + Force Push ───────────────────────────────────────────────
  - key: 'A'
    context: 'files'
    description: 'Amend commit + force push'
    loadingText: 'Amending and pushing...'
    prompts:
      - type: 'confirm'
        title: 'Amend last commit and force push?'
        body: 'This will amend the last commit and force push to origin.'
    command: 'git commit --amend --no-edit && git push --force-with-lease'

  # ── Gitflow ──────────────────────────────────────────────────────────

  # New branch (unified menu)
  - key: '<c-n>'
    context: 'localBranches'
    description: 'Gitflow: new branch'
    loadingText: 'Creating branch...'
    prompts:
      - type: 'menu'
        title: 'Branch type'
        key: 'Type'
        options:
          - value: 'feature'
            name: 'Feature'
            description: 'new feature branch off develop'
            key: 'f'
          - value: 'release'
            name: 'Release'
            description: 'release branch off develop'
            key: 'r'
          - value: 'hotfix'
            name: 'Hotfix'
            description: 'hotfix branch off main'
            key: 'h'
          - value: 'develop'
            name: 'Develop'
            description: 'checkout/create develop branch'
            key: 'd'
          - value: 'custom'
            name: 'Custom'
            description: 'plain branch, no gitflow prefix'
            key: 'c'
      - type: 'input'
        title: 'Task ID (optional, e.g. PROJ-123)'
        key: 'TaskID'
        initialValue: ''
      - type: 'input'
        title: 'Branch name'
        key: 'Name'
    command: >-
      {{if eq .Form.Type "feature"}}
      git flow feature start {{if .Form.TaskID}}{{.Form.TaskID}}-{{end}}{{.Form.Name}}
      {{else if eq .Form.Type "release"}}
      git flow release start {{.Form.Name}}
      {{else if eq .Form.Type "hotfix"}}
      git flow hotfix start {{.Form.Name}}
      {{else if eq .Form.Type "develop"}}
      git checkout develop 2>/dev/null || git checkout -b develop main
      {{else if eq .Form.Type "custom"}}
      git checkout -b {{if .Form.TaskID}}{{.Form.TaskID}}-{{end}}{{.Form.Name}}
      {{end}}

  # Feature finish
  - key: '<c-g>'
    context: 'localBranches'
    description: 'Gitflow: feature finish'
    loadingText: 'Finishing feature...'
    prompts:
      - type: 'menuFromCommand'
        title: 'Feature branch to finish'
        key: 'Branch'
        command: "git branch --list 'feature/*'"
    command: 'git flow feature finish {{.Form.Branch}}'

  # Release finish
  - key: '<c-t>'
    context: 'localBranches'
    description: 'Gitflow: release finish'
    loadingText: 'Finishing release...'
    prompts:
      - type: 'menuFromCommand'
        title: 'Release branch to finish'
        key: 'Branch'
        command: "git branch --list 'release/*'"
    command: 'git flow release finish {{.Form.Branch}}'

  # Hotfix finish
  - key: '<c-j>'
    context: 'localBranches'
    description: 'Gitflow: hotfix finish'
    loadingText: 'Finishing hotfix...'
    prompts:
      - type: 'menuFromCommand'
        title: 'Hotfix branch to finish'
        key: 'Branch'
        command: "git branch --list 'hotfix/*'"
    command: 'git flow hotfix finish {{.Form.Branch}}'

  # Init gitflow
  - key: '<c-i>'
    context: 'status'
    description: 'Gitflow: init'
    loadingText: 'Initializing gitflow...'
    prompts:
      - type: 'confirm'
        title: 'Initialize gitflow in this repo?'
        body: 'Will run "git flow init -d" with default branch names.'
    command: 'git flow init -d'

  # Feature track (publish)
  - key: '<c-p>'
    context: 'localBranches'
    description: 'Gitflow: feature publish'
    loadingText: 'Publishing feature...'
    prompts:
      - type: 'menuFromCommand'
        title: 'Feature branch to publish'
        key: 'Branch'
        command: "git branch --list 'feature/*'"
    command: 'git flow feature publish {{.Form.Branch}}'

  # Feature pull
  - key: '<c-u>'
    context: 'localBranches'
    description: 'Gitflow: feature pull'
    loadingText: 'Pulling feature...'
    prompts:
      - type: 'input'
        title: 'Feature branch name'
        key: 'Name'
    command: 'git flow feature pull origin {{.Form.Name}}'
